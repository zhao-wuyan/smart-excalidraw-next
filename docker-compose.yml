version: '3.8'

services:
  smart-excalidraw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-excalidraw
    ports:
      - "7777:5555"
    environment:
      - NODE_ENV=production
      - PORT=5555
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    restart: unless-stopped
    # 如果需要持久化数据，可以添加 volumes
    # volumes:
    #   - ./data:/app/data
